<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 わんこと韓国語会話（韓国語→日本語）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Georgia:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F0F8FF;
    --light: #E0EEFF;
    --mist: #C8DCFF;
    --sky: #A8C4FF;
    --blue: #4A7FD9;
    --dark-blue: #2E5DB4;
    --navy: #1A3A7A;
    --deep: #0F2550;
    --accent: #E83A6A;
    --dark-accent: #C82850;
    --gold: #FFD700;
    --soft-red: #FF6B8A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--light) 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px 0 24px;
    background: linear-gradient(160deg, var(--cream) 0%, var(--light) 100%);
    position: relative;
    overflow: hidden;
  }

  /* 태극기 장식 */
  #app::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,40,80,0.07) 0%, rgba(74,127,217,0.07) 100%);
    pointer-events: none;
  }

  /* ===== HEADER ===== */
  .header { padding: 0 20px; }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .app-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.3px;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--blue);
    font-weight: 300;
    margin-top: 1px;
  }

  .day-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 500;
    color: var(--dark-blue);
    background: rgba(168,196,255,0.6);
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .day-btn:hover { background: var(--mist); transform: scale(1.04); }

  .progress-bar-wrap {
    background: rgba(168,196,255,0.3);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--blue));
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 11px;
    color: rgba(46,93,180,0.8);
    text-align: center;
    margin-bottom: 4px;
  }

  /* ===== PHRASE CARD ===== */
  .card-wrap {
    padding: 0 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .phrase-card {
    background: rgba(255,255,255,0.93);
    border-radius: 28px;
    box-shadow: 0 8px 32px rgba(74,127,217,0.14);
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    min-height: 340px;
    justify-content: center;
    border: 1.5px solid rgba(168,196,255,0.4);
  }

  /* ===== DOG CHARACTER ===== */
  .dog-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 8px;
  }

  .dog-shadow {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 13px;
    background: rgba(74,127,217,0.12);
    border-radius: 50%;
  }

  .dog-emoji {
    font-size: 68px;
    position: relative;
    z-index: 1;
    display: block;
    user-select: none;
  }

  .dog-note {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 19px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .dog-wrap.singing .dog-note { opacity: 1; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-9px) rotate(3deg); }
    75% { transform: translateY(-5px) rotate(-3deg); }
  }

  .dog-wrap.playing .dog-emoji {
    animation: bounce 0.9s ease-in-out infinite;
  }

  /* ===== CARD CONTENT ===== */
  .card-content {
    width: 100%;
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .category-badge {
    display: inline-block;
    background: rgba(168,196,255,0.35);
    color: var(--dark-blue);
    font-size: 11px;
    font-weight: 500;
    border-radius: 20px;
    padding: 3px 12px;
    margin-bottom: 2px;
  }

  .english-text {
    font-family: 'Georgia', serif;
    font-size: 23px;
    font-weight: 700;
    color: var(--deep);
    line-height: 1.4;
  }

  .korean-row {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .korean-text {
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1.5;
  }

  .romanize-text {
    font-size: 12px;
    color: var(--blue);
    font-weight: 300;
    font-style: italic;
  }

  .hint-text {
    font-size: 12px;
    color: var(--blue);
    margin-top: 2px;
  }

  .prompt-big { font-size: 28px; }

  .prompt-text {
    font-size: 16px;
    color: rgba(74,127,217,0.8);
    font-weight: 300;
  }

  .done-text {
    font-size: 16px;
    color: var(--accent);
    font-weight: 700;
  }

  .idle-day-text {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.5;
  }

  .idle-phrases {
    margin: 4px 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
    padding: 0 12px;
  }

  .idle-phrase-item {
    font-family: 'Georgia', serif;
    font-size: 13px;
    color: var(--dark-blue);
  }

  .idle-hint {
    font-size: 15px;
    color: rgba(46,93,180,0.8);
    font-weight: 300;
    line-height: 1.7;
  }

  /* Review UI */
  .review-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 6px;
  }
  .rdot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--light);
    transition: background 0.3s;
  }
  .rdot.active { background: var(--accent); }

  .review-counter {
    font-size: 12px;
    font-weight: 500;
    color: var(--blue);
    margin-bottom: 4px;
  }

  .review-kr-big {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin: 4px 0;
    line-height: 1.5;
  }

  .review-thinking { font-size: 26px; margin: 2px 0; }

  .review-answer-text {
    font-family: 'Georgia', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--deep);
    margin-bottom: 4px;
  }

  .finished-emoji { font-size: 48px; margin-bottom: 4px; }
  .finished-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
  }
  .finished-sub {
    font-size: 15px;
    color: var(--blue);
    line-height: 1.7;
    font-weight: 300;
  }

  /* ===== CONTROLS ===== */
  .controls {
    padding: 0 20px;
    margin-top: 12px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .stop-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 44px;
    color: var(--blue);
    opacity: 0.3;
    transition: opacity 0.2s, transform 0.2s;
    line-height: 1;
    padding: 0;
  }
  .stop-btn.active { opacity: 1; }
  .stop-btn.active:hover { transform: scale(1.08); }
  .stop-btn:disabled { cursor: default; }

  .play-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--dark-accent));
    box-shadow: 0 4px 18px rgba(200,40,80,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .play-btn.review-mode {
    background: linear-gradient(135deg, var(--blue), var(--dark-blue));
    box-shadow: 0 4px 18px rgba(46,93,180,0.35);
  }
  .play-btn:hover:not(:disabled) { transform: scale(1.06); }
  .play-btn:disabled { transform: scale(0.95); cursor: default; opacity: 0.88; }
  .play-btn .btn-icon { font-size: 24px; line-height: 1; }
  .play-btn .btn-label { font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-align: center; }

  .phrase-num {
    width: 60px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .num-sub { font-size: 10px; color: rgba(46,93,180,0.6); }
  .num-main { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .num-total { font-size: 10px; color: rgba(46,93,180,0.6); }
  .num-review { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .num-review-sub { font-size: 10px; color: rgba(200,40,80,0.8); }

  /* ===== DAY PICKER MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-panel {
    background: var(--cream);
    border-radius: 28px 28px 0 0;
    padding: 20px 16px 36px;
    width: 100%;
    max-width: 430px;
    max-height: 80vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.34,1.1,0.64,1);
  }
  .modal-overlay.open .modal-panel { transform: translateY(0); }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--navy); }
  .modal-close {
    background: none;
    border: none;
    font-size: 15px;
    color: var(--blue);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
  }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .day-grid-btn {
    background: var(--light);
    border: none;
    border-radius: 10px;
    padding: 9px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    transition: transform 0.15s, background 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .day-grid-btn:hover { transform: scale(1.06); background: var(--mist); }
  .day-grid-btn.current { background: var(--accent); }
  .day-grid-btn .dnum { font-size: 15px; font-weight: 700; color: var(--navy); }
  .day-grid-btn .dlabel { font-size: 8px; color: var(--blue); }
  .day-grid-btn.current .dnum,
  .day-grid-btn.current .dlabel { color: white; }

  /* ===== LANG INDICATOR ===== */
  .lang-flags {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 16px;
    margin-top: 1px;
  }
  .lang-arrow { font-size: 11px; color: var(--blue); }

  .fade-in {
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="app-title">🐾 わんこと韓国語会話</div>
        <div class="lang-flags">🇰🇷 <span class="lang-arrow">→</span> 🇯🇵 <span style="font-size:11px;color:var(--blue);margin-left:2px;">韓国語→日本語</span></div>
      </div>
      <button class="day-btn" onclick="openDayPicker()">📅 Day <span id="dayLabel">1</span></button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel">1 / 5 フレーズ目</div>
  </div>

  <!-- PHRASE CARD -->
  <div class="card-wrap">
    <div class="phrase-card">
      <div class="dog-wrap" id="dogWrap">
        <div class="dog-shadow"></div>
        <span class="dog-emoji" id="dogEmoji">🐶</span>
        <span class="dog-note">♪</span>
      </div>
      <div class="card-content" id="cardContent"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="control-row">
      <button class="stop-btn" id="stopBtn" onclick="handleStop()" disabled>⏹</button>
      <button class="play-btn" id="playBtn" onclick="handlePlay()">
        <span class="btn-icon" id="btnIcon">▶</span>
        <span class="btn-label" id="btnLabel">スタート</span>
      </button>
      <div class="phrase-num" id="phraseNum">
        <span class="num-sub">No.</span>
        <span class="num-main" id="numMain">1</span>
        <span class="num-total">/ 300</span>
      </div>
    </div>
  </div>
</div>

<!-- DAY PICKER MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeDayPickerOutside(event)">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title">📅 日を選ぶ</div>
      <button class="modal-close" onclick="closeDayPicker()">閉じる</button>
    </div>
    <div class="day-grid" id="dayGrid"></div>
  </div>
</div>

<script>

const DOG_EMOJIS = ["🐶","🐕","🦮","🐩","🐾","🐕‍🦺"];

// ============================================================
// STATE
// ============================================================
let currentDay = 1;
let currentIndex = 0;
let isPlaying = false;
let isFinished = false;
let isReviewing = false;
let isReviewFinished = false;
let reviewPhrases = [];
let reviewIndex = 0;
let stepTimers = [];
let step = 'idle';

// ============================================================
// STORAGE
// ============================================================
function loadDay() {
  const saved = parseInt(localStorage.getItem('wanko_kr_day') || '0');
  if (saved > 0 && saved <= 60) currentDay = saved;
  const lastDate = localStorage.getItem('wanko_kr_lastDate') || '';
  const today = new Date().toDateString();
  if (lastDate !== today) {
    localStorage.setItem('wanko_kr_lastDate', today);
    if (saved > 0) {
      currentDay = Math.min(saved + 1, 60);
      localStorage.setItem('wanko_kr_day', String(currentDay));
    } else {
      localStorage.setItem('wanko_kr_day', '1');
    }
  }
}
function saveDay(d) { localStorage.setItem('wanko_kr_day', String(d)); }

// ============================================================
// DERIVED
// ============================================================
function todayPhrases() {
  const start = (currentDay - 1) * 5;
  return ALL_PHRASES.slice(start, start + 5);
}
function currentPhrase() {
  const p = todayPhrases();
  return p[Math.min(currentIndex, p.length - 1)] || {id:0, en:'', kr:'', rom:'', ja:'', cat:''};
}
function dogEmoji() { return DOG_EMOJIS[currentDay % DOG_EMOJIS.length]; }

// ============================================================
// SPEECH（韓国語 → 日本語）女性の声を優先選択
// ============================================================

// 女性声キャッシュ
const femaleVoiceCache = {};

// 指定言語の女性声を探して返す
function getFemaleVoice(lang) {
  if (femaleVoiceCache[lang]) return femaleVoiceCache[lang];

  const voices = speechSynthesis.getVoices();
  if (voices.length === 0) return null;

  // 女性を示すキーワード（英語・日本語・韓国語表記に対応）
  const femaleKeywords = [
    'female', 'woman', 'girl',
    'kyoko', 'otoya', 'o-ren',       // macOS 日本語女性
    'haruka', 'nanami', 'ayumi',      // Windows 日本語女性
    'yuna', 'sora', 'seoyeon',        // 韓国語女성
    'google 日本語', 'google 한국의',
    '女性', 'Kyoko', 'Haruka',
  ];

  // ① 同じ言語コードで女性キーワード含む声
  let voice = voices.find(v =>
    v.lang.startsWith(lang.split('-')[0]) &&
    femaleKeywords.some(k => v.name.toLowerCase().includes(k.toLowerCase()))
  );

  // ② 見つからなければ同じ言語の最初の声（多くは女性）
  if (!voice) {
    voice = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
  }

  if (voice) femaleVoiceCache[lang] = voice;
  return voice || null;
}

function speak(text, lang, rate = 0.9) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = rate;
  u.pitch = 1.1;  // 少し高めに（女性声らしく）

  const voice = getFemaleVoice(lang);
  if (voice) u.voice = voice;

  speechSynthesis.speak(u);
}

function stopSpeech() { if (window.speechSynthesis) speechSynthesis.cancel(); }

// 声リストの読み込みを待ってから初期化
function initVoices() {
  return new Promise(resolve => {
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) { resolve(); return; }
    // 一部ブラウザは非同期で読み込む
    speechSynthesis.onvoiceschanged = () => resolve();
    setTimeout(resolve, 1500); // タイムアウト保険
  });
}

// 韓国語 + 日本語 を順に読む
function speakKrJa(phrase) {
  stopSpeech();
  speak(phrase.kr, 'ko-KR', 0.88);
  setTimeout(() => speak(phrase.ja, 'ja-JP', 0.92), 1400);
}
// 韓国語のみ
function speakKr(phrase) { stopSpeech(); speak(phrase.kr, 'ko-KR', 0.88); }
// 日本語のみ（復習ヒント）
function speakJa(phrase) { stopSpeech(); speak(phrase.ja, 'ja-JP', 0.92); }

// ============================================================
// TIMERS
// ============================================================
function clearTimers() { stepTimers.forEach(clearTimeout); stepTimers = []; }
function after(ms, fn) { const t = setTimeout(fn, ms); stepTimers.push(t); }

// ============================================================
// LESSON FLOW（韓国語+日本語 → 間 → 韓国語のみ → 間 → 韓国語+日本語）
// ============================================================
function playCurrentPhrase() {
  if (!isPlaying) return;
  const p = currentPhrase();
  step = 'eng1';
  setDogPlaying(true);
  speakKrJa(p);   // ① 韓国語 → 日本語
  renderCard();

  after(5500, () => {
    if (!isPlaying) return;
    step = 'blank1'; renderCard();
    after(3000, () => {
      if (!isPlaying) return;
      step = 'eng2'; speakKr(p); renderCard();  // ② 韓国語のみ
      after(5000, () => {
        if (!isPlaying) return;
        step = 'blank2'; renderCard();
        after(3000, () => {
          if (!isPlaying) return;
          step = 'eng3'; speakKrJa(p); renderCard(); // ③ 韓国語 → 日本語
          after(5500, () => {
            if (!isPlaying) return;
            step = 'blank3'; renderCard();
            after(1500, () => { if (!isPlaying) return; nextPhrase(); });
          });
        });
      });
    });
  });
}

function nextPhrase() {
  const p = todayPhrases();
  if (currentIndex < p.length - 1) {
    currentIndex++;
    playCurrentPhrase();
  } else {
    isFinished = true;
    isPlaying = false;
    step = 'idle';
    setDogPlaying(false);
    const next = Math.min(currentDay + 1, 60);
    saveDay(next);
    renderAll();
  }
}

// ============================================================
// REVIEW FLOW
// ============================================================
function startReview() {
  const p = [...todayPhrases()].sort(() => Math.random() - 0.5).slice(0, 3);
  reviewPhrases = p;
  reviewIndex = 0;
  isReviewing = true;
  isReviewFinished = false;
  setDogPlaying(true);
  playReviewCurrent();
  renderAll();
}

function playReviewCurrent() {
  if (!isReviewing) return;
  const p = reviewPhrases[reviewIndex];
  step = 'rev_kr'; speakJa(p); renderCard();  // 日本語を聞いて韓国語で答える
  after(4000, () => {
    if (!isReviewing) return;
    step = 'rev_blank'; renderCard();
    after(2000, () => {
      if (!isReviewing) return;
      step = 'rev_en'; speakKr(p); renderCard();  // 答え：韓国語
      after(4500, () => {
        if (!isReviewing) return;
        step = 'rev_blank_end'; renderCard();
        after(1500, () => { if (!isReviewing) return; nextReview(); });
      });
    });
  });
}

function nextReview() {
  if (reviewIndex < reviewPhrases.length - 1) {
    reviewIndex++;
    playReviewCurrent();
  } else {
    isReviewing = false;
    isReviewFinished = true;
    setDogPlaying(false);
    step = 'idle';
    renderAll();
  }
}

// ============================================================
// CONTROLS
// ============================================================
function handlePlay() {
  if (isPlaying || isReviewing) return;
  if (isReviewFinished) {
    isReviewFinished = false; isFinished = false; currentIndex = 0;
    isPlaying = true; step = 'idle';
    playCurrentPhrase(); renderAll(); return;
  }
  if (isFinished) { startReview(); return; }
  isPlaying = true; isFinished = false; currentIndex = 0;
  playCurrentPhrase(); renderAll();
}

function handleStop() {
  clearTimers(); stopSpeech();
  isPlaying = false; isReviewing = false;
  step = 'idle'; setDogPlaying(false);
  renderAll();
}

// ============================================================
// DAY PICKER
// ============================================================
function openDayPicker() { buildDayGrid(); document.getElementById('modalOverlay').classList.add('open'); }
function closeDayPicker() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeDayPickerOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeDayPicker(); }
function selectDay(d) {
  handleStop(); currentDay = d; currentIndex = 0;
  isFinished = false; isReviewFinished = false;
  saveDay(d); closeDayPicker(); renderAll();
}
function buildDayGrid() {
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  for (let d = 1; d <= 60; d++) {
    const btn = document.createElement('button');
    btn.className = 'day-grid-btn' + (d === currentDay ? ' current' : '');
    btn.innerHTML = `<span class="dnum">${d}</span><span class="dlabel">Day</span>`;
    btn.onclick = () => selectDay(d);
    grid.appendChild(btn);
  }
}

// ============================================================
// DOG ANIMATION
// ============================================================
function setDogPlaying(on) {
  const wrap = document.getElementById('dogWrap');
  wrap.classList.toggle('playing', on);
  wrap.classList.toggle('singing', on);
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  document.getElementById('dogEmoji').textContent = dogEmoji();
  document.getElementById('dayLabel').textContent = currentDay;
  const p = todayPhrases();
  const prog = p.length > 0 ? (currentIndex / p.length) * 100 : 0;
  document.getElementById('progressBar').style.width = prog + '%';
  document.getElementById('progressLabel').textContent = `${currentIndex + 1} / ${p.length} フレーズ目`;

  const playBtn = document.getElementById('playBtn');
  const btnIcon = document.getElementById('btnIcon');
  const btnLabel = document.getElementById('btnLabel');

  if (isReviewFinished) {
    playBtn.className = 'play-btn';
    btnIcon.textContent = '↺'; btnLabel.textContent = 'もう一度';
    playBtn.disabled = false;
  } else if (isFinished) {
    playBtn.className = 'play-btn review-mode';
    btnIcon.textContent = '📖'; btnLabel.textContent = '復習\nスタート';
    playBtn.disabled = false;
  } else {
    playBtn.className = 'play-btn';
    btnIcon.textContent = '▶'; btnLabel.textContent = 'スタート';
    playBtn.disabled = isPlaying || isReviewing;
  }

  const stopBtn = document.getElementById('stopBtn');
  stopBtn.disabled = !isPlaying && !isReviewing;
  stopBtn.className = 'stop-btn' + ((isPlaying || isReviewing) ? ' active' : '');
  renderPhraseNum();
  renderCard();
}

function renderPhraseNum() {
  const el = document.getElementById('phraseNum');
  if (isReviewing || isReviewFinished) {
    const label = isReviewFinished ? '完了' : `${reviewIndex + 1}/3`;
    el.innerHTML = `<span class="num-review-sub">復習</span><span class="num-review">${label}</span>`;
  } else {
    el.innerHTML = `<span class="num-sub">No.</span><span class="num-main">${currentPhrase().id}</span><span class="num-total">/ 300</span>`;
  }
}

function renderCard() {
  const el = document.getElementById('cardContent');
  el.className = 'card-content fade-in';

  // カテゴリ名マップ（韓国語→日本語）
  const catJa = {
    "① 인사":    "① 挨拶",
    "② 일상회화": "② 日常会話",
    "③ 따뜻한 말":"③ 優しい言葉",
    "④ 유머":    "④ ユーモア",
    "⑤ 생활표현": "⑤ 生活表現",
    "⑥ 마무리":  "⑥ 会話終了",
  };

  if (isReviewFinished) {
    el.innerHTML = `
      <div class="finished-emoji">🎊</div>
      <div class="finished-title">復習も完了です！</div>
      <div class="finished-sub">今日もよく頑張りました 🐾<br>明日もわんこと一緒に<br>また練習しましょうね</div>
    `;
    return;
  }

  if (isReviewing) {
    const p = reviewPhrases[reviewIndex] || {kr:'', ja:''};
    const dots = reviewPhrases.map((_, i) =>
      `<div class="rdot${i <= reviewIndex ? ' active' : ''}"></div>`
    ).join('');

    if (step === 'rev_kr') {
      el.innerHTML = `
        <div class="review-dots">${dots}</div>
        <div class="review-counter">復習 ${reviewIndex + 1} / ${reviewPhrases.length}</div>
        <div class="review-kr-big">🔊 ${p.ja}</div>
        <div class="hint-text">← 韓国語で言えるかな？</div>
      `;
    } else if (step === 'rev_blank') {
      el.innerHTML = `
        <div class="review-dots">${dots}</div>
        <div class="review-thinking">🤔</div>
        <div class="review-kr-big">${p.ja}</div>
        <div class="hint-text">さあ、韓国語で言ってみよう！</div>
      `;
    } else if (step === 'rev_en' || step === 'rev_blank_end') {
      el.innerHTML = `
        <div class="review-dots">${dots}</div>
        <div class="review-answer-text">🔊 ${p.kr}</div>
        <div class="korean-row"><span>🔊</span><span class="korean-text">${p.ja}</span></div>
        <div class="done-text">✨ 正解！</div>
      `;
    }
    return;
  }

  if (isFinished) {
    el.innerHTML = `
      <div class="finished-emoji">🎉</div>
      <div class="finished-title">今日のレッスン完了！</div>
      <div class="finished-sub">5フレーズ、よくできました！<br>復習ボタンを押してみよう 🐾</div>
    `;
    return;
  }

  if (!isPlaying) {
    const p = todayPhrases();
    const list = p.map(ph => `<div class="idle-phrase-item">• ${ph.kr}</div>`).join('');
    el.innerHTML = `
      <div class="idle-day-text">今日は<br>Day ${currentDay} です 🌸</div>
      <div class="idle-phrases">${list}</div>
      <div class="idle-hint">下のボタンを押して<br>スタートしましょう！</div>
    `;
    return;
  }

  const p = currentPhrase();
  const catLabel = catJa[p.cat] || p.cat;

  if (step === 'eng1' || step === 'eng3') {
    el.innerHTML = `
      <span class="category-badge">${catLabel}</span>
      <div class="english-text">🔊 ${p.kr}</div>
      <div class="korean-row"><span>🔊</span><span class="korean-text">${p.ja}</span></div>
      <div class="hint-text">← いっしょに声に出してみよう！</div>
    `;
  } else if (step === 'blank1' || step === 'blank2') {
    el.innerHTML = `
      <span class="category-badge">${catLabel}</span>
      <div class="prompt-big">🐾</div>
      <div class="prompt-text">さあ、声に出してみよう！</div>
    `;
  } else if (step === 'eng2') {
    el.innerHTML = `
      <span class="category-badge">${catLabel}</span>
      <div class="korean-row" style="margin-top:4px">
        <span>🔊</span><span style="font-size:14px;color:var(--dark-blue);">韓国語を聞いて、声に出して！</span>
      </div>
      <div class="review-kr-big">${p.ja}</div>
    `;
  } else if (step === 'blank3') {
    el.innerHTML = `
      <div class="prompt-big">✨</div>
      <div class="done-text">よくできました！</div>
    `;
  }
}

// ============================================================
// INIT
// ============================================================
loadDay();
initVoices().then(() => {
  // 声リストが揃ってからキャッシュを温める
  getFemaleVoice('ko-KR');
  getFemaleVoice('ja-JP');
  renderAll();
});
